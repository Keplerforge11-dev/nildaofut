h1 { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.15; text-wrap: balance; margin: 0; }
h2.sec { font-family: var(--font-display); font-size: 1.05rem; margin: 0.4rem 0 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); }
.lead { margin: 0.25rem 0 0; color: var(--muted); font-size: 1.05rem; }

.note { border: 2px dashed var(--line); border-radius: 0.75rem; padding: 0.7rem 0.9rem; color: var(--muted); font-size: 0.9rem; margin: 0; }

.seg { display: flex; gap: 0.4rem; }
.seg button { flex: 1; min-width: 0; min-height: 3.2rem; border-radius: 0.8rem; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 17px; padding: 0.2rem 0.3rem; }
.seg button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }

.day { display: flex; flex-direction: column; gap: 0.6rem; }
.day-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; padding-top: 0.6rem; }
.badge { background: var(--gold); color: var(--on-gold); font-weight: 700; padding: 0.1rem 0.7rem; border-radius: 99px; letter-spacing: 0.04em; font-size: 0.95rem; }
.day-name { font-weight: 700; font-size: 1.15rem; }

.when { font-weight: 700; color: var(--gold-hi); }

.team { font-size: 1.3rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }

.vs { color: var(--muted); font-size: 0.9rem; margin: 0.1rem 0; }
.time { font-family: var(--font-display); font-size: 1.9rem; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.champ { color: var(--muted); font-size: 0.95rem; }
.info { display: flex; flex-direction: column; gap: 0.15rem; align-items: flex-start; }

.line { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.goals { font-family: var(--font-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.line.win .team, .line.win .goals { color: var(--gold-hi); }

.where-label { font-size: 0.8rem; letter-spacing: 0.1em; font-weight: 700; color: var(--gold); }

.where-tv { font-size: 1.45rem; font-weight: 700; }

.chip.plain { border-color: var(--line); color: var(--muted); }
.where-hint { color: var(--muted); font-size: 0.95rem; }
.remind { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 3.2rem; border-radius: 0.8rem; border: 2px solid var(--gold); color: var(--gold-hi); font-weight: 700; text-decoration: none; padding: 0.4rem 0.8rem; }

.news-title { font-size: 1.3rem; font-weight: 700; line-height: 1.25; text-wrap: pretty; }

.table { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }

.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { flex: none; width: 2.1rem; height: 2.1rem; border: 3px solid var(--muted); border-radius: 0.5rem; display: grid; place-items: center; background: var(--bg); color: var(--on-gold); }
.box.round { border-radius: 50%; }
.box svg { width: 1.4rem; height: 1.4rem; opacity: 0; }
.pick-name { font-size: 1.2rem; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }

.pick:has(input:focus-visible) { outline: 4px solid var(--gold-hi); outline-offset: 2px; }

      <div id="gamesList" class="wrap"></div>

  <main id="screenTeam" hidden>

  </main>
</div>

</nav>

  function sampleNote() {
    var st = DATA.status || {}, parts = [];
    parts.push(st.brasileirao === 'ok' ? 'Jogos, placares e tabela do Brasileirão se atualizam sozinhos a cada poucas horas.' : 'Jogos e tabela do Brasileirão ainda são de exemplo, sem atualização automática.');
    if (st.canais !== 'ok') parts.push('Alguns canais ainda estão a confirmar.');
    if (st.copas !== 'ok') parts.push('Libertadores, Sul-Americana e Copa do Brasil ainda não se atualizam sozinhas.');
    var u = DATA.updated ? new Date(DATA.updated) : null;
    if (u && !isNaN(u)) parts.push('Última atualização: ' + u.toLocaleDateString('pt-BR') + ' às ' + hmTxt(p2(u.getHours()) + ':' + p2(u.getMinutes())) + '.');
    return parts.join(' ');
  }
  var SIZES = [{ s: 1, label: 'normal' }, { s: 1.2, label: 'grande' }, { s: 1.4, label: 'enorme' }];

  function load(key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };

  var champName = {}; CHAMPS.forEach(function (c) { champName[c.id] = c.name; });
  var sel = load('nf-sel', ['br-a', 'sa-lib']);
  if (!Array.isArray(sel)) sel = ['br-a', 'sa-lib'];
  sel = sel.filter(function (id) { return champName[id]; });
  var team = load('nf-team', 'Santos');
  if (CLUBS.indexOf(team) < 0) team = '';
  var editingTeam = false, teamTab = 'games', gamesTab = 'next', days = 7;
  var sizeIdx = load('nf-size', 0);
  if (typeof sizeIdx !== 'number' || !SIZES[sizeIdx]) sizeIdx = 0;


  function applySize() {
    document.documentElement.style.setProperty('--scale', SIZES[sizeIdx].s);
    $('sizeBtn').textContent = 'Letra: ' + SIZES[sizeIdx].label;
  }

  function dateOf(d, t) {
    var x = new Date(); x.setDate(x.getDate() + d);
    var hm = t.split(':'); x.setHours(+hm[0], +hm[1], 0, 0); return x;
  }
  function dayLabel(d) {
    var x = dateOf(d, '12:00');
    var txt = x.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    return { text: txt.charAt(0).toUpperCase() + txt.slice(1), badge: d === 0 ? 'HOJE' : d === 1 ? 'AMANHÃ' : d === -1 ? 'ONTEM' : '' };
  }
  function calLink(g) {
    var s = dateOf(g.d, g.t), e = new Date(s.getTime() + 2 * 3600000);
    var f = function (x) { return x.getFullYear() + p2(x.getMonth() + 1) + p2(x.getDate()) + 'T' + p2(x.getHours()) + p2(x.getMinutes()) + '00'; };
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(g.h + ' x ' + g.a) +
      '&dates=' + f(s) + '/' + f(e) + '&ctz=America%2FSao_Paulo&location=' + encodeURIComponent(g.v || g.tv || '') +
      '&details=' + encodeURIComponent('Onde assistir: ' + (g.tv || 'canal a confirmar') + '. ' + champName[g.c]);
  }
  function whenLine(g, prefix) {
    var l = dayLabel(g.d);
    return '<div class="when">' + (prefix || '') + (l.badge ? l.badge + ' · ' : '') + l.text + '</div>';
  }
  function exChip(g) { return g.tbc ? '<span class="chip plain">Horário a confirmar</span>' : ''; }

  function hmTxt(t) { var p = t.split(':'); return +p[0] + 'h' + (p[1] === '00' ? '' : p[1]); }
  function mascotHtml() {
    var msg;
    var next = team ? GAMES.filter(function (g) { return !g.s && g.d >= 0 && (g.h === team || g.a === team); })[0] : null;
    if (!team) {
      msg = 'Escolha o seu time na aba "Meu time" e eu mostro os jogos dele.';
    } else if (!next) {
      msg = 'Ainda não tenho o próximo jogo do ' + team + '.';
    } else {
      var wd = dateOf(next.d, '12:00').toLocaleDateString('pt-BR', { weekday: 'long' });
      var when = next.d === 0 ? 'hoje' : next.d === 1 ? 'amanhã' : (/feira$/.test(wd) ? 'na ' : 'no ') + wd;
      var at = 'às ' + hmTxt(next.t) + ': ' + next.h + ' x ' + next.a + '.';
      msg = next.d === 0 ? 'Hoje tem jogo do ' + team + '! Começa ' + at : 'O próximo jogo do ' + team + ' é ' + when + ', ' + at;
      msg += next.tv ? ' Onde ver: ' + next.tv.replace(' / ', ' ou ') + '.' : ' O canal ainda não foi informado.';
    }
    return '<div class="mascot"><img src="' + (team && team !== 'Santos' ? 'nildao-selecao.png' : 'nildao.png') + '" alt="Nildão, o personagem do app" width="84"><div class="bubble"><b>Fala, torcedor!</b><span>' + msg + '</span></div></div>';
  }

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; });
  }
  function safeUrl(u) {
    return /^https:\/\/(www\.)?gazetaesportiva\.com\//.test(u) ? esc(u) : 'https://www.gazetaesportiva.com/';
  }

  function card(g, o) {
    o = o || {};
    var tv = TV[g.tv];
    var teams = [g.h, g.a].map(function (n) { return '<div class="team' + (n === team ? ' mine' : '') + '">' + esc(n) + '</div>'; }).join('<div class="vs">contra</div>');
    var info = o.showDay && team ? (g.h === team ? 'Joga em casa' : 'Joga fora de casa') + ' · ' + champName[g.c] : champName[g.c];
    var chans = g.tv ? g.tv.split(' / ') : [];
    var where = chans.length ? chans.map(function (c) {
      var k = TV[c];
      return '<div class="where-main"><span class="where-tv">' + esc(c) + '</span>' + (k ? '<span class="chip' + (k.free ? ' free' : '') + '">' + esc(k.kind) + '</span>' : '') + '</div>' + (k && k.hint ? '<div class="where-hint">' + k.hint + '</div>' : '');
    }).join('') : '<div class="where-main"><span class="where-tv">A confirmar</span></div>';
    var hint = chans.length > 1 ? 'Passa em mais de um canal: ele pode ver em qualquer um.' : chans.length ? '' : 'O canal ainda não foi informado para este jogo.';
    return '<article class="game' + (o.next ? ' next' : '') + '">' + (o.showDay ? whenLine(g, o.next ? 'PRÓXIMO JOGO · ' : '') : '') +
      '<div class="row"><div>' + teams + '</div><div class="time">' + esc(g.t.replace(':', 'h')) + '</div></div>' +
      '<div class="info"><div class="champ">' + info + '</div>' + (g.v ? '<div class="champ">Estádio: ' + esc(g.v) + '</div>' : '') + exChip(g) + '</div>' +
      '<div class="where"><div class="where-label">ONDE ASSISTIR</div>' + where +
      (hint ? '<div class="where-hint">' + hint + '</div>' : '') + '</div>' +
      '<a class="remind" href="' + calLink(g) + '" target="_blank" rel="noopener">Avisar 30 min antes</a></article>';
  }

  function resultCard(g, o) {
    o = o || {};
    var hw = g.s[0] > g.s[1], aw = g.s[1] > g.s[0];
    var line = function (n, goals, w) { return '<div class="line' + (w ? ' win' : '') + '"><span class="team' + (n === team ? ' mine' : '') + '">' + esc(n) + '</span><span class="goals">' + esc(goals) + '</span></div>'; };
    var chip = '';
    if (o.showDay && (g.h === team || g.a === team)) {
      var gf = g.h === team ? g.s[0] : g.s[1], ga = g.h === team ? g.s[1] : g.s[0];
      chip = gf > ga ? '<span class="chip free">Vitória</span>' : gf < ga ? '<span class="chip plain">Derrota</span>' : '<span class="chip">Empate</span>';
    }
    return '<article class="game">' + (o.showDay ? whenLine(g) : '') + line(g.h, g.s[0], hw) + line(g.a, g.s[1], aw) +
      '<div class="where-main"><span class="champ">' + champName[g.c] + ' · jogo encerrado</span>' + chip + exChip(g) + '</div></article>';
  }

  function newsCard(it) {
    return '<article class="game"><div class="when">' + esc(it.d) + ' · Gazeta Esportiva</div><div class="news-title">' + esc(it.t) + '</div>' +
      '<a class="remind" href="' + safeUrl(it.u) + '" target="_blank" rel="noopener">Ler no site da Gazeta Esportiva</a></article>';
  }

  function tableHtml() {
    return '<ol class="table">' + TABLE.map(function (r) {
      var mine = r[1] === team;
      return '<li class="trow' + (mine ? ' mine' : '') + '"><span class="pos">' + r[0] + 'º</span><div class="tname"><div class="team' + (mine ? ' mine' : '') + '">' + r[1] + '</div>' +
        '<div class="tsub">' + r[3] + ' jogos · ' + r[4] + ' V · ' + r[5] + ' E · ' + r[6] + ' D · saldo ' + r[9] + '</div>' +
        (r[0] >= 17 ? '<span class="chip plain">Zona de rebaixamento</span>' : '') +
        '</div><div class="pts"><b>' + r[2] + '</b><span>pontos</span></div></li>';
    }).join('') + '</ol>';
  }

  function byDay(list, fn) {
    var html = '', last = null;
    list.forEach(function (g) {
      if (g.d !== last) {
        if (last !== null) html += '</section>';
        var l = dayLabel(g.d);
        html += '<section class="day"><div class="day-head">' + (l.badge ? '<span class="badge">' + l.badge + '</span>' : '') + '<span class="day-name">' + l.text + '</span></div>';
        last = g.d;
      }
      html += fn(g);
    });
    return last !== null ? html + '</section>' : html;
  }
  function seg(items, active, attr) {
    return '<div class="seg" role="group">' + items.map(function (i) {
      return '<button type="button" ' + attr + '="' + i[0] + '" aria-pressed="' + (i[0] === active) + '">' + i[1] + '</button>';
    }).join('') + '</div>';
  }

  function renderGames() {
    var n = sel.length, list = $('gamesList');
    $('mascotGames').innerHTML = mascotHtml();
    var head = seg([['next', 'Próximos'], ['results', 'Resultados'], ['table', 'Tabela']], gamesTab, 'data-gtab');
    $('gamesTitle').textContent = gamesTab === 'next' ? 'Próximos jogos' : gamesTab === 'results' ? 'Resultados' : 'Tabela do Brasileirão';
    $('chosen').hidden = gamesTab === 'table';
    $('gamesNote').textContent = sampleNote() + (gamesTab === 'next' ? ' Ao tocar em "Avisar 30 min antes", abre o Google Agenda: toque em Salvar e o celular avisa antes do jogo (o aviso segue o ajuste do seu Google Agenda, que costuma ser 30 minutos).' : '');
    if (gamesTab === 'table') {
      $('gamesLead').textContent = 'Série A, depois da 30ª rodada. Vasco e Chapecoense têm um jogo a menos.';
      list.innerHTML = head + tableHtml();
      return;
    }
    $('gamesLead').textContent = n === 0 ? 'Nenhum campeonato escolhido.' : n === 1 ? 'Mostrando 1 campeonato.' : 'Mostrando ' + n + ' campeonatos.';
    $('chosen').innerHTML = sel.map(function (id) { return '<li>' + champName[id] + '</li>'; }).join('');
    if (n === 0) {
      list.innerHTML = head + '<div class="empty"><p>Escolha pelo menos um campeonato para ver os jogos.</p><button class="cta" type="button" data-go="pick">Escolher campeonatos</button></div>';
      return;
    }
    var mineSel = GAMES.filter(function (g) { return sel.indexOf(g.c) > -1; });
    var html;
    if (gamesTab === 'results') {
      var past = mineSel.filter(function (g) { return g.s; }).sort(function (x, y) { return y.d - x.d || y.t.localeCompare(x.t); }).slice(0, 30);
      html = past.length ? byDay(past, function (g) { return resultCard(g); }) : '<div class="empty"><p>Não há resultados para estes campeonatos.</p></div>';
    } else {
      var all = mineSel.filter(function (g) { return !g.s && g.d >= 0; });
      if (!all.length) {
        list.innerHTML = head + '<div class="empty"><p>Não há jogos para estes campeonatos. Campeonatos estaduais estão fora de temporada nesta época do ano.</p><button class="cta" type="button" data-go="pick">Trocar campeonatos</button></div>';
        return;
      }
      var shown = all.filter(function (g) { return g.d < days; });
      html = shown.length ? byDay(shown, function (g) { return card(g); }) : '<div class="empty"><p>Nenhum jogo nos próximos ' + days + ' dias.</p></div>';
      if (all.length > shown.length) html += '<button class="cta ghost" type="button" data-more="1">Ver mais 7 dias</button>';
    }
    list.innerHTML = head + html;
  }

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';

  function renderTeam() {
    var body = $('teamBody');
    if (!team || editingTeam) {
      body.innerHTML = '<div><h1>Qual é o time do coração?</h1><p class="lead">Toque no time. Depois mostramos os jogos, os resultados e as notícias dele.</p></div><div class="stack" id="teamPick">' +
        CLUBS.map(function (c) {
          return '<label class="pick"><input type="radio" name="club" value="' + c + '"' + (c === team ? ' checked' : '') + '><span class="box round">' + CHECK + '</span><span class="pick-name">' + c + '</span></label>';
        }).join('') + '</div>' + (team ? '<button class="cta ghost" type="button" data-cancel="1">Voltar sem trocar</button>' : '');
      return;
    }
    var mine = GAMES.filter(function (g) { return g.h === team || g.a === team; });
    var row = TABLE.filter(function (r) { return r[1] === team; })[0];
    var html = mascotHtml() + '<div><h1>Meu time</h1><div class="myteam">' + team + '</div>' + (row ? '<p class="lead">' + row[0] + 'º lugar no Brasileirão · ' + row[2] + ' pontos</p>' : '') + '</div>' +
      '<button class="cta ghost" type="button" data-change="1">Trocar de time</button>' +
      seg([['games', 'Jogos'], ['results', 'Resultados'], ['news', 'Notícias']], teamTab, 'data-tab');
    var note = sampleNote();
    if (teamTab === 'games') {
      var up = mine.filter(function (g) { return !g.s && g.d >= 0; });
      html += up.length ? '<div class="stack">' + up.map(function (g, i) { return card(g, { showDay: true, next: i === 0 }); }).join('') + '</div>' : '<div class="empty"><p>Ainda não há jogos para o ' + team + '.</p></div>';
    } else if (teamTab === 'results') {
      var past = mine.filter(function (g) { return g.s; }).sort(function (x, y) { return y.d - x.d; }).slice(0, 15);
      html += past.length ? '<div class="stack">' + past.map(function (g) { return resultCard(g, { showDay: true }); }).join('') + '</div>' : '<div class="empty"><p>Ainda não há placar do ' + team + ' nesta fonte. A página da Gazeta mostra só alguns placares da rodada.</p></div>';
    } else {
      var nw = NEWS[team];
      if (!nw) {
        html += '<div class="empty"><p>Ainda não há notícias do ' + team + ' por aqui.</p></div>';
      } else {
        html += '<h2 class="sec">Últimas 5 notícias</h2><div class="stack">' + nw.items.slice(0, 5).map(newsCard).join('') + '</div>';
      }
      note = 'Mostramos só o título; a matéria completa abre no site da Gazeta Esportiva. São sempre as 5 mais novas: quando sai uma nova, a mais antiga deixa a lista.' + (DATA.status && DATA.status.noticias === 'ok' ? ' Elas se atualizam sozinhas.' : ' Estas são de exemplo e ainda não se atualizam sozinhas.');
    }
    body.innerHTML = html + '<p class="note">' + note + '</p>';
  }

  function renderPick() {
    var order = [], groups = {};
    CHAMPS.forEach(function (c) { if (!groups[c.group]) { groups[c.group] = []; order.push(c.group); } groups[c.group].push(c); });
    $('pickList').innerHTML = order.map(function (gr) {
      return '<section class="group"><h2 class="sec">' + gr + '</h2>' + groups[gr].map(function (c) {
        var on = sel.indexOf(c.id) > -1;
        return '<label class="pick"><input type="checkbox" value="' + c.id + '"' + (on ? ' checked' : '') + '><span class="box">' + CHECK + '</span><span class="pick-name">' + c.name + (c.off ? '<div class="pick-state">Fora de temporada agora</div>' : '') + '</span></label>';
      }).join('') + '</section>';
    }).join('');
  }

  var SCREENS = { games: ['screenGames', 'tabGames', renderGames], team: ['screenTeam', 'tabTeam', renderTeam], pick: ['screenPick', 'tabPick', renderPick] };
  function show(which) {
    Object.keys(SCREENS).forEach(function (k) {
      var on = k === which;
      $(SCREENS[k][0]).hidden = !on;
      if (on) $(SCREENS[k][1]).setAttribute('aria-current', 'page'); else $(SCREENS[k][1]).removeAttribute('aria-current');
    });
    SCREENS[which][2]();
    window.scrollTo(0, 0);
  }

  $('tabGames').addEventListener('click', function () { show('games'); });
  $('tabTeam').addEventListener('click', function () { editingTeam = false; show('team'); });
  $('tabPick').addEventListener('click', function () { show('pick'); });
  $('seeGames').addEventListener('click', function () { show('games'); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-more],[data-change],[data-cancel],[data-tab],[data-gtab]');
    if (!t) return;
    if (t.hasAttribute('data-go')) show(t.getAttribute('data-go'));
    else if (t.hasAttribute('data-more')) { days += 7; renderGames(); }
    else if (t.hasAttribute('data-tab')) { teamTab = t.getAttribute('data-tab'); renderTeam(); }
    else if (t.hasAttribute('data-gtab')) { gamesTab = t.getAttribute('data-gtab'); renderGames(); }
    else if (t.hasAttribute('data-change')) { editingTeam = true; renderTeam(); window.scrollTo(0, 0); }
    else if (t.hasAttribute('data-cancel')) { editingTeam = false; renderTeam(); window.scrollTo(0, 0); }
  });
  $('pickList').addEventListener('change', function (e) {
    var id = e.target.value;
    sel = sel.filter(function (x) { return x !== id; });
    if (e.target.checked) sel.push(id);
    save('nf-sel', sel);
  });
  $('teamBody').addEventListener('change', function (e) {
    if (e.target.name !== 'club') return;
    team = e.target.value; editingTeam = false; save('nf-team', team);
    renderTeam(); window.scrollTo(0, 0);
  });
  $('sizeBtn').addEventListener('click', function () { sizeIdx = (sizeIdx + 1) % SIZES.length; save('nf-size', sizeIdx); applySize(); });

  applySize();
  renderGames();
  try {
    fetch('data.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (!d || !d.games || !d.table || !d.table.length) return;
      applyData(d);
      if (team && CLUBS.indexOf(team) < 0) team = '';
      var cur = ['games', 'team', 'pick'].filter(function (k) { return !$(SCREENS[k][0]).hidden; })[0] || 'games';
      SCREENS[cur][2]();
    }).catch(function () {});
  } catch (e) {}
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
})();
</script>
</body>
</html>
