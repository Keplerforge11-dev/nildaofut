name: Atualizar jogos

on:
  schedule:
    - cron: "17 */2 * * *" # de 2 em 2 horas
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar jogos, placares, tabela, canais e notícias
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python update.py
      - name: Salvar o que mudou
        run: |
          git config user.name "Robô NildãoFut"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json debug
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza dados"
            git pull --rebase origin main
            git push
          fi
